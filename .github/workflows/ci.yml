name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full eval suite (all countries) instead of the smoke subset
        type: boolean
        default: false

jobs:
  unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  evals:
    name: Evals gate (${{ inputs.full && 'full' || 'smoke' }})
    needs: unit
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_TRACING_ENVIRONMENT: ci
      # Reproducible: evaluate the prompt committed in the repo, not whatever is labelled in Langfuse.
      PROMPT_SOURCE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skip without an API key (forks)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY not available, evals skipped"
      - name: Run evals (exit 1 if a threshold or the baseline is broken)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run evals -w @sentinel/evals -- ${{ inputs.full && '--country=all' || '--smoke' }}
      - name: Publish report
        if: always() && env.ANTHROPIC_API_KEY != ''
        run: cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-report
          path: evals/reports/latest.md

  contracts:
    name: Contracts service (pytest + retrieval/matching eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/contracts
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/contracts/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/cache@v4
        with:
          path: services/contracts/.cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Contracts are in sync with the dataset
        run: python scripts/build_contracts.py && git diff --exit-code -- data ../../evals/contracts evals/cases.json
      - name: Eval (retrieval only without an API key; LLM clause selection with one)
        run: python evals/run_eval.py ${{ env.ANTHROPIC_API_KEY == '' && '--retrieval-only' || '' }}
      - name: Publish report
        if: always()
        run: cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Docker images + Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Contracts image (runs the tests in the build)
        uses: docker/build-push-action@v6
        with: { context: services/contracts, target: test, push: false }
      - name: Web image
        uses: docker/build-push-action@v6
        with: { context: ., target: web, push: false }
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/invoice-sentinel
      - run: helm template sentinel deploy/helm/invoice-sentinel --set models.fallback=openai:example --set ingress.enabled=true > /dev/null
