name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full eval suite (all countries) instead of the smoke subset
        type: boolean
        default: false

jobs:
  unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  evals:
    name: Evals gate (${{ inputs.full && 'full' || 'smoke' }})
    needs: unit
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_TRACING_ENVIRONMENT: ci
      # Reproducible: evaluate the prompt committed in the repo, not whatever is labelled in Langfuse.
      PROMPT_SOURCE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skip without an API key (forks)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY not available, evals skipped"
      - name: Run evals (exit 1 if a threshold or the baseline is broken)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run evals -w @sentinel/evals -- ${{ inputs.full && '--country=all' || '--smoke' }}
      - name: Publish report
        if: always() && env.ANTHROPIC_API_KEY != ''
        run: cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-report
          path: evals/reports/latest.md

  contracts:
    name: Contracts service (pytest + retrieval/matching eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/contracts
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/contracts/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/cache@v4
        with:
          path: services/contracts/.cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Contracts are in sync with the dataset
        run: python scripts/build_contracts.py && git diff --exit-code -- data ../../evals/contracts evals/cases.json
      - name: Eval (retrieval only without an API key; LLM clause selection with one)
        run: python evals/run_eval.py ${{ env.ANTHROPIC_API_KEY == '' && '--retrieval-only' || '' }}
      - name: Publish report
        if: always()
        run: cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Docker images + Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Contracts image (runs the tests in the build)
        uses: docker/build-push-action@v6
        with: { context: services/contracts, target: test, push: false }
      - name: Web image
        uses: docker/build-push-action@v6
        with: { context: ., target: web, push: false }
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/invoice-sentinel
      - run: helm template sentinel deploy/helm/invoice-sentinel --set models.fallback=openai:example --set ingress.enabled=true > /dev/null

  compose:
    name: Stack up (docker compose) + end-to-end smoke
    needs: images
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: .env for the containers (Langfuse off, local prompt)
        run: printf 'ANTHROPIC_API_KEY=%s\nLANGFUSE_PUBLIC_KEY=\nLANGFUSE_SECRET_KEY=\nPROMPT_SOURCE=local\n' "$ANTHROPIC_API_KEY" > .env
      - name: docker compose up (waits for the contracts healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Contracts service answers from outside the container
        run: |
          curl -fsS localhost:8001/healthz
          # Before the addendum: one strong lexical match, decided by rule (no LLM).
          curl -fsS localhost:8001/v1/match -H 'content-type: application/json' \
            -d '{"supplierTaxId":"A45182060","restaurantTaxId":"B27543107","invoiceDate":"2026-09-15","lines":[{"index":0,"description":"SOLOMILLO CERDO IBERICO","unit":"KG"}]}' \
            | tee match.json
          jq -e '.lines[0].outcome == "MATCHED" and .lines[0].clause.id == "CT-ES-01#3.7" and .lines[0].clause.price.amount == 15.75 and .lines[0].decidedBy == "rule"' match.json
      - name: Web app is up
        run: for i in $(seq 1 30); do curl -fsS -o /dev/null localhost:3000/ && exit 0; sleep 2; done; exit 1
      - name: es-007 through the web app, contracts over the compose network
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          curl -fsS -m 240 localhost:3000/api/process -H 'content-type: application/json' -d '{"sampleId":"es-007"}' | tee process.json
          docker compose exec -T web cat "apps/web/.data/records/$(jq -r .id process.json).json"             | jq '{status: .result.status, reason: .result.reason, attempts: [.result.attempts[] | {model, cached}], contract: (.result.contract | {error, selectModel, llmCalls, lines: [.result.lines[]? | {invoiceLineIndex, kind, clauseId, invoiceUnitPrice, agreedUnitPrice, note}]})}'
          jq -e '.state == "awaiting_review"' process.json
          curl -fsS "localhost:3000/documents/$(jq -r .id process.json)" | grep -q 'CT-ES-01-A1#2.1'
          echo "es-007 claimed against CT-ES-01-A1#2.1"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: docker compose down
        if: always()
        run: docker compose down -v
